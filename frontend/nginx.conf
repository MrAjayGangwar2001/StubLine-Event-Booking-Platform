server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets - meaningful bandwidth savings for JS/CSS bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively (Vite fingerprints filenames,
    # so a new deploy naturally gets new URLs - safe to cache forever).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router client-side routing: any path that isn't a real file
    # falls back to index.html so /events/5 etc. don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small health-check endpoint for load balancers / uptime checks
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
