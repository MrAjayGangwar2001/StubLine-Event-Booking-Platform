name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    name: Backend · Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests (no Docker needed)
        working-directory: backend
        run: mvn test -Dtest='!*IT'

  backend-integration-tests:
    name: Backend · Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # GitHub-hosted runners come with Docker pre-installed, which is all
    # Testcontainers needs - no docker-compose service block required here,
    # the *IT test classes spin up their own MySQL/Redis/Kafka containers.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run integration tests
        working-directory: backend
        run: mvn test -Dtest='*IT'

  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Dummy URLs are fine here - this job only proves the build itself
        # succeeds (no TypeScript/bundling errors), not that it can reach a
        # real backend. Real URLs get supplied at actual deploy time.
        env:
          VITE_API_URL: http://localhost:8080/api
          VITE_WS_URL: http://localhost:8080/ws
        run: npm run build

  docker-build:
    name: Docker · Build Images
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: event-booking-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: event-booking-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:8080/api
            VITE_WS_URL=http://localhost:8080/ws

  # Deploys to AWS EC2 on every push to main, IF the required secrets are
  # configured in the repo (Settings -> Secrets and variables -> Actions).
  # Without them configured, this job is skipped rather than failing the
  # whole pipeline - see DEPLOYMENT.md for the one-time EC2 setup this
  # depends on (Docker + docker-compose installed, security group open on
  # 8080/5173, an SSH key pair added as a secret).
  deploy:
    name: Deploy · AWS EC2
    runs-on: ubuntu-latest
    needs: [backend-integration-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        id: check_secrets
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy - EC2_HOST/EC2_SSH_KEY secrets not set. See DEPLOYMENT.md."
          fi

      - name: Deploy over SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/event-booking-platform
            git pull origin main
            docker compose pull || true
            docker compose up -d --build
            docker image prune -f
